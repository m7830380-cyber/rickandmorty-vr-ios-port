name: Spike - Unity 5.4.3p4 iOS build

# Feasibility test: install Unity 5.4.3p4 (the game's exact version) on a GitHub macOS runner, license it,
# IL2CPP-build an EMPTY test project for iOS (arm64, Metal) and compile it with a current Xcode.
# Contains nothing from the game. The test IPA goes to the private repo's release anyway, like every IPA.

on:
  push:
    branches: [main]
    paths:
      - 'spike/**'
      - 'ci/**'
      - '.github/workflows/spike-unity54.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 5.4.3p4
  UNITY_HASH: 4dfc8d4040f2
  PRIVATE_REPO: m7830380-cyber/rmvr-ios-private

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          sw_vers; uname -m
          ls -d /Applications/Xcode*.app
          xcodebuild -version

      # Unity 5.4 cannot activate itself any more and a .ulf is tied to the machine it was made on, so a modern
      # editor (2020.3.1f1, the version already proven with this account) activates the runner; its license file
      # in /Library/Application Support/Unity is then read by 5.4. Only its editor is installed, next to 5.4.
      - name: Restore licensing editor
        id: licensor-cache
        uses: actions/cache/restore@v4
        with:
          path: /Applications/UnityLicensor
          key: unity-licensor-2020.3.1f1-${{ matrix.runner }}-v1

      - name: Install licensing editor (Unity 2020.3.1f1)
        if: steps.licensor-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/lic.pkg https://download.unity3d.com/download_unity/77a89f25062f/MacEditorInstaller/Unity-2020.3.1f1.pkg
          pkgutil --expand-full /tmp/lic.pkg /tmp/licpkg
          APP=$(find /tmp/licpkg -maxdepth 4 -type d -name Unity.app | head -n 1)
          [ -n "$APP" ] || { find /tmp/licpkg -maxdepth 3; exit 1; }
          mkdir -p /Applications/UnityLicensor
          mv "$APP" /Applications/UnityLicensor/Unity.app
          rm -rf /tmp/lic.pkg /tmp/licpkg
          ls /Applications/UnityLicensor/Unity.app/Contents/Frameworks | head -n 30

      - name: Save licensing editor
        if: steps.licensor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Applications/UnityLicensor
          key: unity-licensor-2020.3.1f1-${{ matrix.runner }}-v1

      - name: Restore Unity install
        id: unity-cache
        uses: actions/cache/restore@v4
        with:
          path: /Applications/Unity
          key: unity-${{ env.UNITY_VERSION }}-ios-${{ matrix.runner }}-v1

      - name: Install Unity ${{ env.UNITY_VERSION }} + iOS support
        if: steps.unity-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE=https://download.unity3d.com/download_unity/$UNITY_HASH
          curl -fsSL --retry 3 -o /tmp/editor.pkg "$BASE/MacEditorInstaller/Unity-$UNITY_VERSION.pkg" &
          curl -fsSL --retry 3 -o /tmp/ios.pkg "$BASE/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-$UNITY_VERSION.pkg" &
          wait
          ls -lh /tmp/*.pkg
          sudo installer -pkg /tmp/editor.pkg -target /
          sudo installer -pkg /tmp/ios.pkg -target /
          rm -f /tmp/editor.pkg /tmp/ios.pkg
          sudo chown -R "$(whoami)" /Applications/Unity

      - name: Save Unity install
        if: steps.unity-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Applications/Unity
          key: unity-${{ env.UNITY_VERSION }}-ios-${{ matrix.runner }}-v1

      # Unity < 5.6 cannot list directories on APFS ("error getting directory contents Assets"), so Unity,
      # the project and the build output all live on a case-insensitive HFS+ disk image.
      - name: Mount HFS+ work volume
        run: |
          set -euo pipefail
          hdiutil create -size 40g -type SPARSE -fs "Journaled HFS+" -volname U /tmp/u.sparseimage
          hdiutil attach /tmp/u.sparseimage -mountpoint /Volumes/U -nobrowse
          diskutil info /Volumes/U | grep -iE "File System Personality|Mount Point"
          sudo ditto /Applications/Unity /Volumes/U/Unity
          sudo rm -rf /Applications/Unity
          sudo ln -s /Volumes/U/Unity /Applications/Unity
          sudo chown -R "$(whoami)" /Volumes/U
          # The editor only registered the platform module inside the app bundle, so put iOS support there too.
          mv /Volumes/U/Unity/PlaybackEngines/iOSSupport /Volumes/U/Unity/Unity.app/Contents/PlaybackEngines/
          ln -s ../Unity.app/Contents/PlaybackEngines/iOSSupport /Volumes/U/Unity/PlaybackEngines/iOSSupport
          # Unity reads module="iPhone" as the BlackBerry target ("Setting BB10 ... iOSSupport") and skips it.
          sed -i '' 's/module="iPhone"/module="iOS"/' /Volumes/U/Unity/Unity.app/Contents/PlaybackEngines/iOSSupport/ivy.xml
          grep -o 'module="[^"]*"' /Volumes/U/Unity/Unity.app/Contents/PlaybackEngines/*/ivy.xml
          cp -R spike /Volumes/U/spike
          df -h /Volumes/U

      # Unity 5.4 lists folders with getdirentriesattr(); test that call on this macOS and build the
      # replacement (ci/dirshim) that answers it with getattrlistbulk().
      - name: Folder-listing shim
        run: |
          set -euo pipefail
          U=/Applications/Unity/Unity.app/Contents/MacOS/Unity
          echo "---- folder APIs Unity imports"
          nm -u "$U" | grep -iE "getdirentries|getattrlist|readdir|opendir|fts_|contentsOfDirectory" || true
          mkdir -p /Volumes/U/shim
          clang -arch x86_64 -O2 -dynamiclib -o /Volumes/U/shim/dirshim.dylib ci/dirshim/dirshim.c
          clang -arch x86_64 -O2 -o /Volumes/U/shim/dirtest ci/dirshim/dirtest.c
          mkdir -p "$RUNNER_TEMP/apfs" && cp -R spike/Assets "$RUNNER_TEMP/apfs/"
          for d in /Volumes/U/spike/Assets "$RUNNER_TEMP/apfs/Assets"; do
            echo "---- $d without shim"; /Volumes/U/shim/dirtest "$d" || true
            echo "---- $d with shim"; DIRSHIM_VERBOSE=1 DYLD_INSERT_LIBRARIES=/Volumes/U/shim/dirshim.dylib /Volumes/U/shim/dirtest "$d" || true
          done
          echo "UNITY_DYLD=/Volumes/U/shim/dirshim.dylib" >> "$GITHUB_ENV"

      # Unity 5.4's "mono" programs are 32-bit, which macOS 10.15+ cannot run. ci/mono-wrapper.sh takes
      # their place and runs Unity's 64-bit mono-sgen instead (and a newer compiler for scripts).
      - name: 64-bit Mono for the compiler
        run: |
          set -euo pipefail
          C=/Applications/Unity/Unity.app/Contents
          ls "$C"/MonoBleedingEdge/lib/mono/ | xargs echo
          ls "$C"/MonoBleedingEdge/lib/mono/4.5/mcs.exe
          for m in "$C/Mono/bin/mono" "$C/MonoBleedingEdge/bin/mono"; do
            file "$m" | grep -q x86_64 && continue
            mv "$m" "$m.i386"; cp ci/mono-wrapper.sh "$m"; chmod +x "$m"
          done
          # Compile a test program the way Unity does and check it references the 2.0 corlib.
          echo 'class T{static void Main(){System.Console.WriteLine("test program ran");}}' > /tmp/t.cs
          echo "-target:exe -out:/tmp/t.exe /tmp/t.cs" > /tmp/t.rsp
          MONO_PATH="$C/Mono/lib/mono/unity" MONO_CFG_DIR="$C/Mono/etc" "$C/Mono/bin/mono" "$C/Mono/lib/mono/unity/smcs.exe" @/tmp/t.rsp
          "$C/Mono/bin/mono" /tmp/t.exe
          "$C/MonoBleedingEdge/bin/monodis" --assemblyref /tmp/t.exe || true

      - name: Check Unity
        run: |
          ls /Applications/Unity/
          ls /Applications/Unity/PlaybackEngines || true
          file /Applications/Unity/Unity.app/Contents/MacOS/Unity
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' /Applications/Unity/Unity.app/Contents/Info.plist || true

      # Why does the iOS module get "Set" but never "Registered"? Look at its manifest and at the editor's loader.
      - name: Diagnose iOS module loading
        continue-on-error: true
        run: |
          PE=/Applications/Unity/Unity.app/Contents/PlaybackEngines
          ls -la "$PE/iOSSupport" | head -n 40
          echo "---- iOS ivy.xml"; cat "$PE/iOSSupport/ivy.xml"
          echo "---- Mac ivy.xml"; cat "$PE/MacStandaloneSupport/ivy.xml"
          dotnet tool install -g ilspycmd --version 8.2.0.7535 || dotnet tool install -g ilspycmd || true
          export PATH="$PATH:$HOME/.dotnet/tools" DOTNET_ROLL_FORWARD=Major DOTNET_ROOT="$HOME/.dotnet"
          ilspycmd -t UnityEditor.Modules.ModuleManager /Applications/Unity/Unity.app/Contents/Managed/UnityEditor.dll > /tmp/mm.cs 2>&1 || true
          wc -l /tmp/mm.cs; head -n 25 /tmp/mm.cs
          grep -n -B40 -A25 "Register platform support module" /tmp/mm.cs | head -n 200
          for m in RegisterPackageManager InitializePackageManager RegisterPlatformSupportModules RegisterModulesFromLoadedAssemblies RegisterPlatformSupportModulesFromAssembly InitializePlatformSupportModules; do
            echo "---- $m"; awk -v m="$m" '$0 ~ ("static [^(]* " m "[<(]") {p=1} p {print NR": "$0} p && /^	}$/ {p=0}' /tmp/mm.cs | head -n 90
          done
          echo "---- native strings"
          strings -a /Applications/Unity/Unity.app/Contents/MacOS/Unity | grep -n -i "platform support module\|not supported in this Unity build\|PlaybackEngines\|Extensions.dll\|iOSSupport" | head -n 40

      # Non-secret facts about the license file, to see whether it is a Unity 5-era or modern license.
      - name: Inspect license file
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          [ -n "$UNITY_LICENSE" ] || { echo "UNITY_LICENSE secret is not set"; exit 0; }
          # Printed with a prefix so GitHub's secret masking (which hides whole secret lines) leaves them readable.
          printf '%s' "$UNITY_LICENSE" | grep -oE '<(LicenseVersion|ClientProvidedVersion|InitialActivationDate|StartDate|StopDate|UpdateDate|SerialMasked)[^>]*>' | sed 's/^/field: /' || true
          printf '%s' "$UNITY_LICENSE" | grep -oE '<Binding Key="[0-9]+"' | sed 's/^/machine binding: /' || true
          printf '%s' "$UNITY_LICENSE" | grep -oE '<[A-Za-z]+' | sort | uniq -c | xargs echo
          printf '%s' "$UNITY_LICENSE" | grep -oE '<Feature Value="[0-9]+"' | tr '\n' ' '; echo

      - name: Activate Unity
        id: activate
        timeout-minutes: 15
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_BIN: /Applications/UnityLicensor/Unity.app/Contents/MacOS/Unity
          UNITY_DYLD: ""
        run: |
          set +e
          SERIAL=$(printf '%s' "$UNITY_LICENSE" | python3 -c "import sys,re,base64; d=re.search(r'<DeveloperData Value=\"([^\"]+)\"',sys.stdin.read()).group(1); print(base64.b64decode(d)[4:].decode())")
          [ -n "$SERIAL" ] || { echo "could not read the serial from UNITY_LICENSE"; exit 1; }
          echo "::add-mask::$SERIAL"
          # Unity otherwise asks for an admin password (GUI dialog) to create these and waits forever
          for d in "/Library/Application Support/Unity" "/Library/Application Support/Unity/licenses" "$HOME/Library/Unity/licenses" "$HOME/Library/Logs/Unity"; do
            sudo mkdir -p "$d"; sudo chown -R "$(whoami)" "$d"; sudo chmod -R 775 "$d"
          done
          sudo chown -R "$(whoami)" "$HOME/Library/Unity" "/Library/Application Support/Unity"
          mkdir -p "$HOME/Library/Unity/cache" /tmp/activate-project
          OK="License activated successfully|license is already valid and activated|Successfully activated"
          for attempt in 1 2; do
            ci/unity.sh /tmp/activate.log 240 "$OK" -quit -serial "$SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath /tmp/activate-project
            rc=$?
            echo "attempt $attempt: exit code $rc"
            [ $rc = 0 ] && break
          done
          # Only file names and non-secret license fields go to the (public) log.
          ls -la "/Library/Application Support/Unity" "/Library/Application Support/Unity/licenses" 2>/dev/null
          ULF="/Library/Application Support/Unity/Unity_lic.ulf"
          [ -f "$ULF" ] && grep -oE '<(LicenseVersion|ClientProvidedVersion|StartDate|StopDate)[^>]*>' "$ULF" | sed 's/^/field: /'
          exit $rc

      - name: Unity build (Xcode project)
        id: unity-build
        timeout-minutes: 45
        env:
          SHELL_OUT: /Volumes/U/xcode
        run: |
          set +e
          ci/unity.sh "$PWD/unity.log" 2400 "" -quit -projectPath /Volumes/U/spike -executeMethod SpikeBuild.Build
          rc=$?
          echo "---- error lines"; grep -n -iE "error|exception|failed|licens" unity.log | head -n 80
          echo "---- last lines"; tail -n 40 unity.log
          echo "---- project files after the run"; find /Volumes/U/spike -maxdepth 3 -not -path '*/Library/*' | head -n 60
          ls -la /Volumes/U/spike/Library/ScriptAssemblies 2>&1 | head
          echo "---- /Volumes/U/act"; find /Volumes/U/act -maxdepth 2 | head -n 30
          [ -f /Volumes/U/xcode/Unity-iPhone.xcodeproj/project.pbxproj ] || { echo "no Xcode project produced"; exit 1; }
          exit $rc

      - name: Return Unity license
        if: always()
        timeout-minutes: 5
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_BIN: /Applications/UnityLicensor/Unity.app/Contents/MacOS/Unity
          UNITY_DYLD: ""
        run: |
          [ -x "$UNITY_BIN" ] || exit 0
          [ -n "$UNITY_EMAIL" ] || exit 0
          ci/unity.sh /tmp/return.log 150 "" -quit -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || true

      - name: Xcode build (unsigned)
        id: xcode
        if: steps.unity-build.outcome == 'success'
        run: |
          cd /Volumes/U/xcode
          # File sharing so Documents (logs, saves) shows up in Files / Filza.
          /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' Info.plist || true
          /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' Info.plist || true
          set +e
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -derivedDataPath "$PWD/dd" ARCHS=arm64 IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            'OTHER_CFLAGS=$(inherited) -Wno-error=implicit-function-declaration -Wno-error=incompatible-function-pointer-types -Wno-error=int-conversion' \
            build > xcodebuild.log 2>&1
          rc=$?
          grep -E "error:|\*\* BUILD" xcodebuild.log | sort | uniq -c | sort -rn | head -n 80
          tail -n 40 xcodebuild.log
          cp xcodebuild.log "$GITHUB_WORKSPACE/"
          exit $rc

      - name: Package fakesigned IPA
        if: steps.xcode.outcome == 'success'
        run: |
          set -euo pipefail
          brew install ldid
          APP="$(find /Volumes/U/xcode/dd -name '*.app' -path '*Release-iphoneos*' | head -n 1)"
          echo "app: $APP"
          ldid -S "$APP/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry RMVR-spike.ipa Payload
          ls -lh RMVR-spike.ipa

      # Artifacts of a public repo are public and GitHub does not mask secrets inside files, so activation
      # logs (Unity writes the account email into them) are never uploaded, and the uploaded logs are scrubbed.
      - name: Scrub logs
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        run: |
          for f in unity.log xcodebuild.log; do
            [ -f "$f" ] || continue
            [ -n "$UNITY_EMAIL" ] && F="$UNITY_EMAIL" perl -pi -e 's/\Q$ENV{F}\E/<email>/g' "$f"
            perl -pi -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g' "$f"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-logs-${{ matrix.runner }}
          path: |
            unity.log
            xcodebuild.log
          if-no-files-found: ignore

      - name: Publish spike IPA (private repo)
        if: steps.xcode.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "PRIVATE_REPO_TOKEN not set - skipping"; exit 0; }
          TAG=spike-unity54
          gh release view "$TAG" --repo "$PRIVATE_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Unity 5.4 spike (empty test app, no game content)" --notes "run ${{ github.run_number }}" --prerelease --repo "$PRIVATE_REPO"
          gh release upload "$TAG" RMVR-spike.ipa --clobber --repo "$PRIVATE_REPO"
